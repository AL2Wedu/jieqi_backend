<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节气 · 管理台</title>
<link rel="stylesheet" href="/static/vendor/xterm.css">
<style>
  :root {
    --bg: #171717; --surface: #0f0f0f; --surface-2: #1f1f1f; --surface-3: #242424;
    --border: #2e2e2e; --border-hi: #363636;
    --text: #fafafa; --text-2: #b4b4b4; --text-3: #898989;
    --green: #3ecf8e; --green-link: #00c573; --green-border: rgba(62,207,142,.3);
    --danger: #ff6b6b; --warn: #f5c451;
    --radius: 10px; --radius-sm: 6px;
    --font: 'Inter','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
    --mono: 'Source Code Pro',Consolas,'Courier New',monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; }
  .mono { font-family: var(--mono); }
  button { font-family: var(--font); cursor: pointer; }
  input, select, textarea { font-family: var(--font); }

  /* ---------- 登录 ---------- */
  #login { height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 36px 32px; }
  .login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .logo-dot { width: 14px; height: 14px; border-radius: 4px; background: var(--green); box-shadow: 0 0 12px rgba(62,207,142,.5); }
  .login-logo h1 { font-size: 20px; font-weight: 500; letter-spacing: 1px; }
  .login-logo .sub { font-size: 12px; color: var(--text-3); font-family: var(--mono); letter-spacing: 2px; text-transform: uppercase; }
  .login-card label { display: block; font-size: 12px; color: var(--text-2); margin: 16px 0 6px; }
  .login-card .inp { width: 100%; }

  /* ---------- 布局 ---------- */
  #app { display: none; height: 100vh; grid-template-columns: 216px 1fr; grid-template-rows: 1fr auto; }
  #app.on { display: grid; }
  #sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 18px 12px; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 4px 10px 18px; }
  .brand h2 { font-size: 15px; font-weight: 500; }
  .nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; margin-bottom: 2px;
    background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm); color: var(--text-2); font-size: 13.5px; text-align: left; transition: all .12s; }
  .nav-btn:hover { background: var(--surface-2); color: var(--text); }
  .nav-btn.active { background: var(--surface-2); color: var(--green); border-color: var(--green-border); }
  .nav-ico { width: 16px; text-align: center; opacity: .85; }
  .side-foot { position: absolute; bottom: 0; left: 0; width: 216px; padding: 14px 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-3); }
  #sidebar { position: relative; padding-bottom: 64px; }

  #main { overflow-y: auto; padding: 26px 30px; }
  .page-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; }
  .page-head h1 { font-size: 22px; font-weight: 500; }
  .page-head .mono { color: var(--text-3); font-size: 12px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .card-title { font-size: 12px; color: var(--text-3); margin-bottom: 8px; }
  .card-big { font-size: 26px; font-weight: 400; letter-spacing: -.3px; }
  .card-sub { font-size: 12px; color: var(--text-2); margin-top: 6px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 18px; overflow: hidden; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 18px; border-bottom: 1px solid var(--border); }
  .panel-head h3 { font-size: 14px; font-weight: 500; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11.5px; color: var(--text-3); font-weight: 500; padding: 10px 14px; border-bottom: 1px solid var(--border); letter-spacing: .5px; }
  td { padding: 10px 14px; border-bottom: 1px solid #222; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }

  .badge { display: inline-block; padding: 2px 10px; border-radius: 9999px; font-size: 12px; border: 1px solid var(--border); color: var(--text-2); }
  .badge.ok { color: var(--green); border-color: var(--green-border); }
  .badge.bad { color: var(--danger); border-color: rgba(255,107,107,.35); }
  .badge.off { color: var(--text-3); }

  .btn { background: var(--surface-3); color: var(--text); border: 1px solid var(--border-hi); border-radius: var(--radius-sm); padding: 7px 16px; font-size: 13px; transition: all .12s; }
  .btn:hover { border-color: var(--text-3); }
  .btn.primary { background: #0f0f0f; border-color: var(--text); border-radius: 9999px; padding: 8px 24px; }
  .btn.primary:hover { border-color: var(--green); color: var(--green); }
  .btn.green { color: var(--green); border-color: var(--green-border); }
  .btn.danger { color: var(--danger); border-color: rgba(255,107,107,.35); }
  .btn.small { padding: 4px 12px; font-size: 12px; border-radius: 9999px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .inp { background: var(--surface); border: 1px solid var(--border-hi); border-radius: var(--radius-sm); color: var(--text); padding: 8px 12px; font-size: 13px; outline: none; }
  .inp:focus { border-color: var(--green); }
  .inp.mono { font-family: var(--mono); font-size: 12.5px; }
  .inp.mini { width: 90px; padding: 4px 8px; }
  .inp.mid { width: 150px; }
  .inp.wide { width: 100%; }

  .row-actions { display: flex; gap: 6px; }
  .pager { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--text-2); }
  .empty { padding: 34px; text-align: center; color: var(--text-3); }
  .loading { padding: 40px; text-align: center; color: var(--text-3); }
  .error { padding: 40px; text-align: center; color: var(--danger); }

  /* ---------- 弹窗 ---------- */
  .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; align-items: center; justify-content: center; }
  .modal-mask.on { display: flex; }
  .modal-box { width: 520px; max-width: 94vw; max-height: 88vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--border-hi); border-radius: 14px; padding: 24px 26px; }
  .modal-box h3 { font-size: 16px; font-weight: 500; margin-bottom: 18px; }
  .form-row { display: flex; gap: 12px; margin-bottom: 12px; }
  .form-field { flex: 1; }
  .form-field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 5px; }
  .form-field .inp { width: 100%; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  /* ---------- Toast ---------- */
  #toast { position: fixed; right: 22px; bottom: 22px; z-index: 99; display: flex; flex-direction: column; gap: 8px; }
  .toast-item { background: var(--surface-3); border: 1px solid var(--border-hi); border-left: 3px solid var(--green); border-radius: var(--radius-sm); padding: 10px 16px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.4); animation: slidein .18s ease; }
  .toast-item.err { border-left-color: var(--danger); }
  @keyframes slidein { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- 终端栏 ---------- */
  #term-bar { grid-column: 1 / -1; background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-direction: column; }
  #term-bar.collapsed { height: 40px; }
  #term-bar.collapsed #term-body { display: none; }
  #term-head { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--border); height: 40px; }
  #term-head .t-label { font-size: 12px; color: var(--text-2); font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; }
  .t-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
  .t-dot.on { background: var(--green); box-shadow: 0 0 8px rgba(62,207,142,.6); }
  #term-body { height: 240px; padding: 4px 0; }
  #term-body .xterm { height: 100%; padding: 0 8px; }
  .term-msg { padding: 18px; color: var(--text-3); font-size: 13px; }
  .spacer { flex: 1; }

  /* 内联编辑 */
  .kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cfg-item { display: flex; align-items: center; gap: 10px; }
  .cfg-item .key { width: 180px; color: var(--green-link); font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
  .env-box { max-height: 200px; overflow-y: auto; }
  .env-box table td { padding: 6px 14px; font-size: 12px; }
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <form class="login-card" onsubmit="return doLogin(event)">
    <div class="login-logo">
      <div class="logo-dot"></div>
      <div>
        <h1>节气 · 管理台</h1>
        <div class="sub">JIEQI ADMIN</div>
      </div>
    </div>
    <label>管理员账号</label>
    <input class="inp" id="login-user" value="admin" autocomplete="username">
    <label>密码</label>
    <input class="inp" id="login-pass" type="password" autocomplete="current-password">
    <div style="margin-top: 24px;">
      <button class="btn primary" type="submit" style="width:100%">登 录</button>
    </div>
  </form>
</div>

<!-- 主界面 -->
<div id="app">
  <aside id="sidebar">
    <div class="brand"><div class="logo-dot"></div><h2>节气 · 管理台</h2></div>
    <button class="nav-btn active" data-view="dashboard" onclick="switchView('dashboard')"><span class="nav-ico">◈</span>仪表盘</button>
    <button class="nav-btn" data-view="users" onclick="switchView('users')"><span class="nav-ico">👥</span>用户列表</button>
    <button class="nav-btn" data-view="config" onclick="switchView('config')"><span class="nav-ico">⚙</span>全局配置</button>
    <button class="nav-btn" data-view="crops" onclick="switchView('crops')"><span class="nav-ico">🌾</span>作物管理</button>
    <button class="nav-btn" data-view="plantings" onclick="switchView('plantings')"><span class="nav-ico">🌱</span>种植状态</button>
    <button class="nav-btn" data-view="items" onclick="switchView('items')"><span class="nav-ico">🎒</span>道具管理</button>
    <button class="nav-btn" data-view="pricing" onclick="switchView('pricing')"><span class="nav-ico">¥</span>定价</button>
    <button class="nav-btn" data-view="terms" onclick="switchView('terms')"><span class="nav-ico">☀</span>节气设置</button>
    <button class="nav-btn" data-view="worlds" onclick="switchView('worlds')"><span class="nav-ico">🌍</span>世界管理</button>
    <button class="nav-btn" data-view="shop" onclick="switchView('shop')"><span class="nav-ico">🛒</span>商店管理</button>
    <button class="nav-btn" data-view="ai" onclick="switchView('ai')"><span class="nav-ico">🤖</span>AI 设置</button>
    <button class="nav-btn" data-view="pest" onclick="switchView('pest')"><span class="nav-ico">🐛</span>虫害设置</button>
    <div class="side-foot">
      <div class="mono" style="font-size:11px;color:var(--text-3)">PID 未知</div>
      <button class="btn small danger" style="margin-top:8px" onclick="logout()">退出登录</button>
    </div>
  </aside>

  <main id="main">
    <div id="view" class="loading">加载中…</div>
  </main>

  <div id="term-bar">
    <div id="term-head">
      <span class="t-dot" id="term-dot"></span>
      <span class="t-label">后端日志 · 实时监控(server.out.log)</span>
      <button class="btn small" onclick="termClear()">清屏</button>
      <span class="spacer"></span>
      <button class="btn small" onclick="toggleTerm()">收起 / 展开</button>
    </div>
    <div id="term-body"><div id="xterm"></div></div>
  </div>
</div>

<div class="modal-mask" id="modal"><div class="modal-box" id="modal-box"></div></div>
<div id="toast"></div>

<script src="/static/vendor/xterm.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const state = { token: localStorage.getItem('admin_token') || '', view: 'dashboard' };

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, type) { const t = document.createElement('div'); t.className = 'toast-item' + (type==='err'?' err':''); t.textContent = msg; $('#toast').appendChild(t); setTimeout(()=>t.remove(), 3200); }

async function api(path, method='GET', body) {
  const res = await fetch('/v1/admin' + path, {
    method,
    headers: { 'Content-Type': 'application/json', ...(state.token ? {Authorization:'Bearer '+state.token} : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await res.json().catch(() => ({ code: 99999, message: 'HTTP ' + res.status }));
  if (res.status === 401 && (j.code === 10002 || j.code === 10003)) { logout(); throw new Error('登录已过期'); }
  if (j.code !== 0) throw new Error(j.message || '请求失败');
  return j.data;
}

/* ---------- 登录 ---------- */
async function doLogin(e) {
  e.preventDefault();
  try {
    const d = await api('/login', 'POST', { username: $('#login-user').value.trim(), password: $('#login-pass').value });
    state.token = d.token; localStorage.setItem('admin_token', d.token);
    enterApp();
  } catch (err) { toast(err.message, 'err'); }
  return false;
}
function logout() { state.token = ''; localStorage.removeItem('admin_token'); location.reload(); }
function enterApp() {
  $('#login').style.display = 'none';
  $('#app').classList.add('on');
  switchView('dashboard');
  initTerminal(); connectTerminal();
  setInterval(() => { if (state.view === 'dashboard') loadView(); }, 15000);
}

/* ---------- 视图路由 ---------- */
const views = { dashboard, users, config, crops, plantings, items, pricing, terms, worlds, shop, ai, pest };
function switchView(name) {
  state.view = name;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  loadView();
}
async function loadView() {
  const el = $('#view');
  el.innerHTML = '<div class="loading">加载中…</div>';
  try { await views[state.view](el); } catch (err) { el.innerHTML = '<div class="error">' + esc(err.message) + '</div>'; }
}

/* ---------- 仪表盘 ---------- */
async function dashboard(el) {
  const d = await api('/dashboard');
  const c = d.counts;
  document.querySelector('.side-foot .mono').textContent = 'PID ' + d.server.pid + ' · v' + d.server.version;
  el.innerHTML = `
    <div class="page-head"><h1>仪表盘</h1><span class="mono">服务 PID ${d.server.pid} · v${d.server.version} · 数据库 ${(d.server.db_size/1024).toFixed(1)} KB</span></div>
    <div class="cards">
      ${card('全局速率', d.clock.time_scale + '×', d.clock.paused ? '⏸ 已暂停' : '▶ 运行中')}
      ${card('注册用户', c.users, `${c.players} 位玩家`)}
      ${card('农场', c.farms, `${c.growing} 块地种植中`)}
      ${card('金币总量', c.coins_total.toLocaleString(), '全服经济总量')}
      ${card('世界运行时间', (c.world_accum_total/3600).toFixed(1) + 'h', '所有玩家世界累计秒总和')}
      ${card('作物', c.crops, '配置表')}
      ${card('道具', c.items, '目录')}
    </div>`;
}
function card(title, big, sub) {
  return `<div class="card"><div class="card-title">${esc(title)}</div><div class="card-big">${esc(big)}</div><div class="card-sub">${esc(sub)}</div></div>`;
}

/* ---------- 用户列表 ---------- */
let userPage = 1;
async function users(el) {
  const d = await api(`/users?page=${userPage}&page_size=20`);
  const totalPages = Math.max(1, Math.ceil(d.total / d.page_size));
  el.innerHTML = `
    <div class="page-head"><h1>用户列表</h1><span class="mono">共 ${d.total} 人</span></div>
    <div class="panel"><table>
      <thead><tr><th>用户名</th><th>ID</th><th>状态</th><th>等级</th><th>金币</th><th>注册IP</th><th>注册时间</th><th>操作</th></tr></thead>
      <tbody>${d.items.map(u => `<tr>
        <td>${esc(u.name)}</td>
        <td class="mono" style="color:var(--text-3)">${u.user_id.slice(0,8)}…</td>
        <td>${u.status === 1 ? '<span class="badge ok">正常</span>' : '<span class="badge bad">封禁</span>'}</td>
        <td>${u.player ? 'Lv.' + u.player.level : '—'}</td>
        <td>${u.player ? u.player.coins : '—'}</td>
        <td class="mono" style="color:var(--text-3)">${esc(u.register_ip || '—')}</td>
        <td style="color:var(--text-3)">${esc((u.created_at||'').slice(0,10))}</td>
        <td><div class="row-actions">
          <button class="btn small" onclick="openAssets('${u.user_id}')">资产</button>
          <button class="btn small" onclick="openFarm('${u.user_id}')">农场</button>
          <button class="btn small" onclick="openInventory('${u.user_id}')">背包</button>
          <button class="btn small" onclick="openStorage('${u.user_id}')">收成仓</button>
          <button class="btn small ${u.status===1?'danger':'green'}" onclick="toggleBan('${u.user_id}', ${u.status===1?0:1})">${u.status===1?'封禁':'解封'}</button>
        </div></td>
      </tr>`).join('') || '<tr><td colspan="8" class="empty">暂无用户</td></tr>'}</tbody>
    </table>
    <div class="pager"><button class="btn small" onclick="userPage--;loadView()" ${userPage<=1?'disabled':''}>‹ 上一页</button><span>第 ${userPage} / ${totalPages} 页</span><button class="btn small" onclick="userPage++;loadView()" ${userPage>=totalPages?'disabled':''}>下一页 ›</button></div>
    </div>`;
}
async function toggleBan(uid, status) {
  try { await api(`/users/${uid}/status`, 'PATCH', { status }); toast(status ? '已解封' : '已封禁'); loadView(); }
  catch (err) { toast(err.message, 'err'); }
}

/* ---------- 玩家资产编辑 ---------- */
async function openAssets(uid) {
  try {
    const a = await api('/users/' + uid + '/assets');
    openModal(`<h3>编辑玩家资产 · ${esc(a.name)}</h3>
      <div class="mono" style="color:var(--text-3);margin-bottom:12px">当前:金币 ${a.coins} · Lv.${a.level} · 经验 ${a.exp} · 解锁节气 ${a.unlocked_term_index}</div>
      <div class="form-field"><label>金币</label><input class="inp" id="a-coins" type="number" min="0" value="${a.coins}"></div>
      <div class="form-field" style="margin-top:10px"><label>等级</label><input class="inp" id="a-level" type="number" min="1" value="${a.level}"></div>
      <div class="form-field" style="margin-top:10px"><label>经验</label><input class="inp" id="a-exp" type="number" min="0" value="${a.exp}"></div>
      <div class="form-field" style="margin-top:10px"><label>已解锁节气(1-24)</label><input class="inp" id="a-term" type="number" min="1" max="24" value="${a.unlocked_term_index}"></div>
      <div class="modal-foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveAssets('${uid}')">保存</button></div>`);
  } catch (err) { toast(err.message, 'err'); }
}
async function saveAssets(uid) {
  const ids = [['a-coins','coins'], ['a-level','level'], ['a-exp','exp'], ['a-term','unlocked_term_index']];
  const payload = {};
  for (const [id, key] of ids) {
    const v = $('#' + id).value;  // $ 是 querySelector,必须带 '#'
    if (v !== '') payload[key] = parseInt(v, 10);
  }
  try { await api('/users/' + uid + '/assets', 'PATCH', payload); closeModal(); toast('资产已更新'); loadView(); }
  catch (err) { toast(err.message, 'err'); }
}

/* ---------- 农场地块管理(含作物控制) ---------- */
async function openFarm(uid) {
  try {
    const [d, crops] = await Promise.all([
      api('/users/' + uid + '/farm'),
      api('/crops'),
    ]);
    const cropOpts = crops.items.filter(c => c.active).map(c =>
      `<option value="${c.crop_id}">${esc(c.name)}</option>`).join('') || '<option value="">无可用作物</option>';
    openModal(`<h3>农场 · ${esc(d.name)}</h3>
      <div class="mono" style="color:var(--text-3);margin-bottom:14px">当前节气 ${esc(d.current_term.name)}(${d.current_term.term_index}/24) · 剩 ${d.current_term.remaining_sec}s · 作物控制不消耗种子、不校验节气窗</div>
      <table><thead><tr><th>地块</th><th>作物</th><th>进度%</th><th>浇水</th><th>肥力</th><th>操作</th></tr></thead>
      <tbody>${d.plots.map(p => `<tr>
        <td class="mono">#${p.idx}${p.locked?' 🔒':''}</td>
        <td><select class="inp" style="min-width:120px" id="crop-sel-${p.idx}">${cropOpts}</select>
            <div class="mono" style="color:var(--text-3);font-size:11px;margin-top:3px">当前:${p.crop ? esc(p.crop.name) + ' · 阶段' + p.crop.stage + ' · ' + p.crop.growth_progress + '%' : '—'}</div></td>

async function saveCrop() {
  const payload = {
    name: $('#cr-name').value.trim(), category: $('#cr-cat').value,
    sow_window: { type: 'term', start: +$('#cr-s').value, end: +$('#cr-e').value, grace: +$('#cr-g').value },
    grow_seconds: +$('#cr-grow').value, yield_base: +$('#cr-yield').value, base_price: +$('#cr-price').value,
    unlock_level: +$('#cr-ul').value, unlock_exp: +$('#cr-ue').value,
    description: $('#cr-desc').value.trim(),
    art: { seed: $('#cr-art-seed').value.trim(), stages: [$('#cr-art-1').value.trim(), $('#cr-art-2').value.trim(), $('#cr-art-3').value.trim()] },
  };
  // 高级设定:非法 JSON 不提交(弹提示)
  try { payload.settings = JSON.parse($('#cr-settings').value || '{}'); }
  catch (err) { toast('高级设定 JSON 格式错误: ' + err.message, 'err'); return; }
  if (cropDraft) {
    try { await api(`/crops/${cropDraft.crop_id}`, 'PUT', payload); toast('已保存'); }
    catch (err) { toast(err.message, 'err'); return; }
  } else {
    payload.auto_seed = $('#cr-seed').checked;
    try { await api('/crops', 'POST', payload); toast('已创建' + (payload.auto_seed ? '(含种子)' : '')); }
    catch (err) { toast(err.message, 'err'); return; }
  }
  closeModal(); loadView();
}

/* ---------- 后端日志监控(只读流,等价 Get-Content -Wait) ---------- */
let term = null, termWS = null;
function initTerminal() {
  if (!window.Terminal) { $('#xterm').innerHTML = '<div class="term-msg">xterm.js 未加载</div>'; return; }
  term = new Terminal({
    theme: { background: '#0f0f0f', foreground: '#d6d6d6', cursor: '#3ecf8e', selectionBackground: 'rgba(62,207,142,.25)' },
    fontSize: 13, fontFamily: "'Source Code Pro',Consolas,monospace", cursorBlink: false,
    convertEol: true,
  });
  term.open(document.getElementById('xterm'));
  term.write('\x1b[32m[日志监控] 连接中…\x1b[0m\r\n');
}
function connectTerminal() {
  if (!term) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  termWS = new WebSocket(`${proto}://${location.host}/v1/admin/logs?token=${encodeURIComponent(state.token)}`);
  termWS.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'log') term.writeln(m.data);
    else if (m.type === 'error') term.writeln('\x1b[33m' + m.data + '\x1b[0m');
  };
  termWS.onopen = () => $('#term-dot').classList.add('on');
  termWS.onclose = () => {
    $('#term-dot').classList.remove('on');
    term.writeln('\r\n\x1b[33m[日志连接已断开,5 秒后重连]\x1b[0m');
    setTimeout(() => { try { connectTerminal(); } catch (_) {} }, 5000);
  };
}
function termClear() { if (term) term.clear(); }
function toggleTerm() { $('#term-bar').classList.toggle('collapsed'); }

      sell_price: sellRaw === '' ? null : parseInt(sellRaw),
    });
    toast('已保存(空覆盖=恢复公式价)');
    openShopUser(pid, '');
    loadShopUsers();
  } catch (err) { toast(err.message, 'err'); }
}

/* ---------- 虫害设置(频率/大虫害/阶段倒计时 + 事件记录) ---------- */
async function pest(el) {
  const cfg = await api('/pest/config');
  const sw = cfg['pest.stage_wait'] || {};
  el.innerHTML = `
    <div class="page-head"><h1>虫害设置</h1><span class="mono">每用户隔离调度 · 每 ${cfg['pest.window_terms']} 个节气平均 ${cfg['pest.events_per_window']} 次</span></div>
    <div class="panel" style="max-width:680px">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">
        <input type="checkbox" id="pest-enabled" ${cfg['pest.enabled'] ? 'checked' : ''}>
        <label style="color:var(--text)">启用虫害系统</label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="form-field"><label>每窗口事件数(平均)</label>
          <input class="inp mono" type="number" min="1" id="pest-events" value="${esc(cfg['pest.events_per_window'])}"></div>
        <div class="form-field"><label>窗口节气数</label>
          <input class="inp mono" type="number" min="1" id="pest-window" value="${esc(cfg['pest.window_terms'])}"></div>
        <div class="form-field"><label>大虫害占比(0~1)</label>
          <input class="inp mono" type="number" step="0.05" min="0" max="1" id="pest-bigratio" value="${esc(cfg['pest.big_ratio'])}"></div>
        <div class="form-field"><label>大虫害音游时长(秒)</label>
          <input class="inp mono" type="number" min="5" id="pest-bigdur" value="${esc(cfg['pest.big_duration_seconds'])}"></div>
        <div class="form-field"><label>成绩提交最短耗时系数(防作弊)</label>
          <input class="inp mono" type="number" step="0.05" min="0" max="1" id="pest-minelapsed" value="${esc(cfg['pest.min_elapsed_factor'])}"></div>
        <div class="form-field"><label>达标分数线(score/max)</label>
          <input class="inp mono" type="number" step="0.05" min="0" max="1" id="pest-pass" value="${esc(cfg['pest.pass_ratio'])}"></div>
        <div class="form-field"><label>大虫害奖励金币</label>
          <input class="inp mono" type="number" min="0" id="pest-coins" value="${esc(cfg['pest.reward_coins'])}"></div>
      </div>
      <div style="margin-top:12px;font-size:13px;color:var(--text-2)">小虫害摧毁倒计时(秒,按作物阶段):</div>
      <div style="display:flex;gap:10px;margin-top:6px">
        <div class="form-field"><label>苗期</label><input class="inp mono" type="number" min="10" id="pest-w1" value="${esc(sw[1] || 120)}"></div>
        <div class="form-field"><label>生长期</label><input class="inp mono" type="number" min="10" id="pest-w2" value="${esc(sw[2] || 90)}"></div>
        <div class="form-field"><label>成熟期</label><input class="inp mono" type="number" min="10" id="pest-w3" value="${esc(sw[3] || 60)}"></div>
      </div>
      <div style="margin-top:16px">
        <button class="btn primary" onclick="savePestCfg()">保存配置</button>
      </div>
    </div>
    <div class="page-head" style="margin-top:26px"><h2 style="font-size:15px;font-weight:600">虫害事件记录</h2><button class="btn small" onclick="loadPestEvents()">刷新</button></div>
    <div class="panel"><table>
      <thead><tr><th>玩家</th><th>类型</th><th>结果</th><th>成绩</th><th>miss</th><th>奖励/惩罚</th><th>时间</th></tr></thead>
      <tbody id="pest-events-body"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
    </table></div>`;
  loadPestEvents();
}
async function loadPestEvents() {
  try {
    const d = await api('/pest/events?page=1&page_size=30');
    $('#pest-events-body').innerHTML = d.items.map(e => {
      const tag = e.type === 'big'
        ? (e.score === null ? '⏳ 进行中' : (e.reward ? '✅ 奖励' : '❌ 惩罚'))
        : (e.status === 0 ? '🐛 寄生中' : (e.status === 2 ? '💀 已摧毁' : '🛡 已驱赶'));
      const detail = e.reward ? `💰${e.reward.coins || 0}` : (e.penalty ? `🐛×${e.penalty.targets || 0}` : '');
      return `<tr>
        <td>${esc(e.player)}</td>
        <td>${e.type === 'big' ? '大虫害' : '小虫害'}</td>
        <td>${tag}</td>
        <td class="mono">${e.score === null ? '-' : `${e.score}/${e.max_score}`}</td>
        <td class="mono">${e.miss_count === null ? '-' : e.miss_count}</td>
        <td>${esc(detail)}</td>
        <td class="mono">${esc((e.broadcast_at || '').slice(0, 16))}</td></tr>`;
    }).join('') || '<tr><td colspan="7" class="empty">暂无虫害事件</td></tr>';
  } catch (e) {
    $('#pest-events-body').innerHTML = `<tr><td colspan="7" class="empty">${esc(e.message)}</td></tr>`;
  }
}
async function savePestCfg() {
  try {
    await api('/pest/config', 'PUT', {
      'pest.enabled': $('#pest-enabled').checked,
      'pest.events_per_window': parseInt($('#pest-events').value) || 3,
      'pest.window_terms': parseInt($('#pest-window').value) || 2,
      'pest.big_ratio': parseFloat($('#pest-bigratio').value) || 0.3,
      'pest.big_duration_seconds': parseInt($('#pest-bigdur').value) || 30,
      'pest.min_elapsed_factor': parseFloat($('#pest-minelapsed').value) || 0.6,
      'pest.pass_ratio': parseFloat($('#pest-pass').value) || 0.6,
      'pest.reward_coins': parseInt($('#pest-coins').value) || 20,
      'pest.stage_wait': {
        1: parseInt($('#pest-w1').value) || 120,
        2: parseInt($('#pest-w2').value) || 90,
        3: parseInt($('#pest-w3').value) || 60,
      },
    });
    toast('虫害配置已保存');
    loadView();
  } catch (err) { toast(err.message, 'err'); }
}

/* ---------- 启动 ---------- */
// 支持 #token=xxx 片段深链登录(片段不进服务器日志,便于开发/自动化验证)
const fragToken = new URLSearchParams(location.hash.slice(1)).get('token');
if (fragToken) {
  state.token = fragToken;
  localStorage.setItem('admin_token', fragToken);
}
if (state.token) {
  api('/dashboard').then(() => enterApp()).catch(() => { /* 登录过期则留在登录页 */ });
}
</script>
